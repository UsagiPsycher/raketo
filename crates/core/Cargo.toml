[package]
name = "raketo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model catalogue, frame format and raster encoders for iPrint-compatible thermal printers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
lzokay-native = "0.1"
flate2 = "1"
thiserror = "2"
