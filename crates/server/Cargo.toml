[package]
name = "raketo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LAN sharing: web page, HTTP API and an IPP Everywhere printer advertised over mDNS"

[dependencies]
raketo-core = { path = "../core" }
raketo-service = { path = "../service" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mdns-sd = "0.13"
local-ip-address = "0.6"
gethostname = "1"
rust-embed = "8"
mime_guess = "2"
log = "0.4"
uuid = { version = "1", features = ["v5"] }
