name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # Oldest supported Ubuntu keeps the AppImage runnable on most distributions.
          - os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      # The `raketo` console command ships next to the app on Windows (raketo.com).
      - name: Windows command line
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build -p raketo-cmd --release
          mkdir -p src-tauri/binaries
          cp target/release/raketo-cmd.exe src-tauri/binaries/raketo-cmd-x86_64-pc-windows-msvc.exe

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Raketo ${{ github.ref_name }}
          releaseBody: See the notes below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Portable Windows build
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir portable
          cp target/release/raketo.exe portable/raketo.exe
          cp target/release/raketo-cmd.exe portable/raketo.com
          pwsh -NoProfile -Command "Compress-Archive -Path portable/* -DestinationPath Raketo_${version}_x64_portable.zip"
          gh release upload "$GITHUB_REF_NAME" "Raketo_${version}_x64_portable.zip" --clobber

  android:
    # After the desktop builds, which create the draft release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - run: npm ci

      - name: Signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RAKETO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing key in the repository secrets: skipping the APK."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raketo-release.jks"
          export RAKETO_KEYSTORE="$RUNNER_TEMP/raketo-release.jks"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 --target armv7
          version="${GITHUB_REF_NAME#v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Raketo_${version}_android.apk"
          gh release upload "$GITHUB_REF_NAME" "Raketo_${version}_android.apk" --clobber
