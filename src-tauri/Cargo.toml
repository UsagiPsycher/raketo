[package]
name = "raketo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "raketo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
raketo-core = { path = "../crates/core" }
raketo-service = { path = "../crates/service" }
raketo-server = { path = "../crates/server" }
raketo-client = { path = "../crates/client" }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Console"] }
